# Add-on for embedding backends without an own server (openai, bedrock): no TEI container.
#   docker compose -f docker-compose.yml -f docker-compose.api.yml up -d
# Variant A (nginx): additionally --profile proxy. See docs/embedding.md.
services:
  tei-embed:
    profiles: ["disabled"]
  server:
    depends_on: !override
      postgres:
        condition: service_healthy
