# Example: resource limits for a shared server on which other containers already run
# (meant for roughly 4 vCPU and 8 GB RAM). Not part of the default configuration.
#
# Usage, in the project folder:
#   docker compose -f docker-compose.yml -f deploy/examples/docker-compose.limits.yml up -d
# With the bundled nginx additionally --profile proxy, without an own TEI see docker-compose.api.yml.
#
# In addition, set the frugal start arguments for TEI in .env (otherwise TEI needs about 12 GB):
#   TEI_ARGS=--model-id BAAI/bge-m3 --max-batch-tokens 1024 --auto-truncate
#
# The values are starting points from measurements with bge-m3 (docs/embedding.md):
#   2 cores: about 1.7 GB RAM, about 2.5 s per section
#   4 cores: about 2.1 GB RAM, about 1 s per section
# Adjust to your own server and check with `docker stats` after starting.
services:
  tei-embed:
    # Fewer cores = slower indexing, but the other containers stay responsive.
    cpus: 2
    mem_limit: 2500m
    # Some swap as a buffer; with the same value as mem_limit there would instead be a
    # restart by restart: unless-stopped as soon as TEI reaches the limit.
    memswap_limit: 3g
  postgres:
    mem_limit: 512m
  server:
    mem_limit: 256m
