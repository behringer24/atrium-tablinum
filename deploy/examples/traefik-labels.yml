# Variant B with an existing Traefik: place as docker-compose.override.yml next to docker-compose.yml.
# Assumption: Traefik runs in the external network "traefik" with entrypoint "websecure" and resolver "letsencrypt".
# In config.yaml: set instance.trusted_proxies to the address or subnet of Traefik.
services:
  server:
    ports: !reset []        # no host port needed
    networks: [atrium, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.atrium.rule=Host(`knowledge.example.com`)
      - traefik.http.routers.atrium.entrypoints=websecure
      - traefik.http.routers.atrium.tls.certresolver=letsencrypt
      - traefik.http.services.atrium.loadbalancer.server.port=8080

networks:
  traefik:
    external: true
