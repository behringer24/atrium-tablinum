# Production. Variants (see docs/deployment.md):
#   A   own nginx + Let's Encrypt:     docker compose --profile proxy up -d
#   B/C existing proxy or tunnel:      docker compose up -d
# Configuration: .env (see .env.example); config.yaml (see config.example.yaml) only for what .env does not cover.
name: atrium-tablinum
services:
  server:
    build: .
    image: atrium-tablinum:latest
    restart: unless-stopped
    environment:
      # The server runs with an account that cannot change the schema or alter the audit log; a
      # second account applies the migrations at start (docs/deployment.md, "Separate database
      # accounts"). The superuser's password is only used by postgres and db-init.
      DATABASE_URL: postgres://atrium_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/knowledge
      DATABASE_MIGRATION_URL: postgres://atrium_migrate:${MIGRATE_DB_PASSWORD:?set MIGRATE_DB_PASSWORD in .env}@postgres:5432/knowledge
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ATRIUM_BASE_URL: ${ATRIUM_BASE_URL:-}
      ATRIUM_ALLOWED_DOMAIN: ${ATRIUM_ALLOWED_DOMAIN:-}
      # Read by config.yaml (${ATRIUM_SHORT_NAME:-...}) for the first start only; afterwards an
      # instance admin changes the names with admin_instance.
      ATRIUM_SHORT_NAME: ${ATRIUM_SHORT_NAME:-}
      ATRIUM_ORGANIZATION_NAME: ${ATRIUM_ORGANIZATION_NAME:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      # Bedrock: on ECS/EC2 the IAM role is enough, otherwise keys of a restricted IAM user.
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ${CONFIG_FILE:-./config.yaml}:/etc/atrium-tablinum/config.yaml:ro
    # Variant A needs no publishing (nginx reaches the server in the Compose network).
    # Variant B/C: set SERVER_BIND to the interface the proxy can reach.
    ports:
      - "${SERVER_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      tei-embed:
        condition: service_started
    networks: [atrium]

  # Sets up the two database accounts before the server starts. Runs as the superuser, changes
  # nothing that is already right, and exits; safe on every start and on an existing database.
  db-init:
    image: pgvector/pgvector:0.8.0-pg17
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?set MIGRATE_DB_PASSWORD in .env}
    volumes:
      - ./scripts/db-roles.sql:/db-roles.sql:ro
    entrypoint: ["/bin/sh", "-c", "psql -h postgres -U knowledge -d knowledge -v ON_ERROR_STOP=1 -v app_password=\"$$APP_DB_PASSWORD\" -v migrate_password=\"$$MIGRATE_DB_PASSWORD\" -f /db-roles.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [atrium]

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      retries: 10
    networks: [atrium]

  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    # On small servers set TEI_ARGS in .env, see docs/embedding.md (memory requirements).
    # Without an own embedding server (openai, bedrock): add docker-compose.api.yml.
    command: ${TEI_ARGS:---model-id BAAI/bge-m3 --max-batch-tokens 8192}
    volumes:
      - teidata:/data
    networks: [atrium]

  # --- variant A only (--profile proxy) ---
  nginx:
    profiles: ["proxy"]
    image: nginx:1.28-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/knowledge.conf.template:/etc/nginx/templates/knowledge.conf.template:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    # Reload certificates every 6 hours after renewal.
    command: >
      /bin/sh -c "while :; do sleep 6h; nginx -s reload; done &
      exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    depends_on: [server]
    networks: [atrium]

  certbot:
    profiles: ["proxy"]
    image: certbot/certbot:v4.1.1
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks: [atrium]

networks:
  atrium:
    ipam:
      config:
        # fixed so that instance.trusted_proxies stays stable for the bundled nginx
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  teidata:
  certbot-www:
  letsencrypt:
