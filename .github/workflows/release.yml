# Build: the tests run first, then the server image for linux/amd64 and linux/arm64 is built in
# the GitHub Container Registry (ghcr.io/<owner>/<repo>). Description: docs/release.md
#  - a tag of the form vX.Y.Z (or vX.Y.Z-rc1) publishes the version tags (and latest for releases)
#  - a push to the dev branch publishes only the moving tag "canary" and an immutable
#    "canary-<short sha>". Never latest and never a version tag.
name: build

on:
  push:
    tags: ["v*.*.*"]
    branches: [dev]

permissions:
  contents: read

# A newer push to dev supersedes a running canary build; release builds are never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: knowledge
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATRIUM_TEST_DATABASE_URL: postgres://knowledge:knowledge@localhost:5432/knowledge
    steps:
      - name: Check tag
        if: github.ref_type == 'tag'
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not have the form vX.Y.Z" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      # Known vulnerabilities in the standard library and in the dependencies that the code reaches.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # QEMU is only needed for the steps of the arm64 runtime stage (apk, adduser);
      # the Go compiler runs natively and cross-compiles for arm64 (see Dockerfile).
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lowercase, the repo name may contain uppercase letters.
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          # v1.2.3 yields 1.2.3, 1.2 and (from 1.0) 1 as well as latest. Pre-releases do not get latest.
          # The semver rules match tags only. A push to dev yields canary and canary-<short sha>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=canary,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=canary-,format=short,enable=${{ github.ref_type == 'branch' }}
          # latest only for a release tag, never for a canary build.
          flavor: |
            latest=${{ github.ref_type == 'tag' && 'auto' || 'false' }}
      # server_info reports this: the version for a release, canary-<short sha> for a canary build.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="canary-${GITHUB_SHA::7}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - id: commitdate
        run: echo "value=$(git log -1 --format=%cs)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Without this buildx pushes a provenance attestation per platform, two more untagged
          # entries in the package list per build that nobody uses.
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            BUILD_DATE=${{ steps.commitdate.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
