# Tests: gofmt, vet, the tests against a Postgres with pgvector and govulncheck, for pushes to the dev branch
# and for tags of the form vX.Y.Z. The container images are built and published by the maintainer's build
# pipeline, which is told about each successful run (job "notify"). Description: docs/release.md
name: test

on:
  push:
    tags: ["v*.*.*"]
    branches: [dev]

permissions:
  contents: read

# A newer push to dev supersedes a running test run; runs for tags are never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: knowledge
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATRIUM_TEST_DATABASE_URL: postgres://knowledge:knowledge@localhost:5432/knowledge
    steps:
      - name: Check tag
        if: github.ref_type == 'tag'
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not have the form vX.Y.Z" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      # Known vulnerabilities in the standard library and in the dependencies that the code reaches.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Tells the maintainer's build pipeline that this ref passed. Without the secret (forks, other
  # clones) the job does nothing.
  notify:
    needs: test
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TOKEN: ${{ secrets.PRO_DISPATCH_TOKEN }}
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then echo "no token, nothing to notify"; exit 0; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/behringer24/atrium-tablinum-pro/dispatches \
            -d "{\"event_type\":\"public-build\",\"client_payload\":{\"ref\":\"$REF\",\"ref_type\":\"$REF_TYPE\",\"sha\":\"$SHA\"}}"
