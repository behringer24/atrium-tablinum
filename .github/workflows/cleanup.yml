# Manual retention for the container package. Every successful canary build already prunes itself
# (job "prune" in release.yml, keeping the newest three canary-<short sha> versions); this workflow
# is for a dry run to see what would go, or for cleaning up by hand. Release tags (1.2.3, 1.2, 1,
# latest) are never selected. Description: docs/release.md
#
# Needs the secret PACKAGES_PAT: a classic personal access token with the scopes
# read:packages and delete:packages (wildcards in image-tags do not work with GITHUB_TOKEN).
name: cleanup

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: prune-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ secrets.PACKAGES_PAT }}
          image-names: atrium-tablinum
          image-tags: "canary-*"
          tag-selection: both
          cut-off: 1h
          keep-n-most-recent: 3
          dry-run: ${{ inputs.dry-run }}
