# Example configuration. Secrets only via environment variables (${VAR}).
instance:
  product_name: "Atrium Tablinum"
  short_name: "Atrium"                  # how users say it in chat
  organization_name: "Example Corp"          # appears in tool descriptions
  # Icon for the favicon and the MCP server info: svg, png, ico, jpg or webp, up to 256 KB.
  # Empty = the built-in Atrium icon. Served without login at /favicon.ico and /icon.
  # icon_file: "/etc/atrium/logo.svg"
  log_level: info                         # debug adds one log line per MCP request (see docs/skills.md)
  base_url: "https://knowledge.example.com"   # public address, no matter which proxy sits in front
  listen: ":8080"
  dev_mode: false                         # local only (base_url on localhost); static test token
  # dev_token: "mindestens-16-zeichen"   # mandatory with dev_mode, is neither generated nor logged
  # Proxies whose X-Forwarded-* headers are trusted (IP or CIDR).
  # Leave empty if the server is reachable directly.
  # Bundled nginx in the Compose network: ["172.30.0.0/24"]; own proxy: its IP.
  trusted_proxies: []

auth:
  providers:
    - id: google
      type: google
      client_id: "${GOOGLE_CLIENT_ID}"
      client_secret: "${GOOGLE_CLIENT_SECRET}"
      allowed_domains: ["example.com"]
      # allowed_emails: ["me@gmail.com"]   # single addresses, e.g. private Gmail accounts (no hd claim)
    # - id: entra
    #   type: entra
    #   client_id: "${ENTRA_CLIENT_ID}"
    #   client_secret: "${ENTRA_CLIENT_SECRET}"
    #   allowed_tenants: ["<tenant-guid>"]
    #   allowed_domains: ["example.com"]
    #   groups_claim: true
    # - id: keycloak
    #   type: oidc
    #   issuer: "https://sso.example.com/realms/main"
    #   client_id: "..."
    #   client_secret: "..."
    #   allowed_domains: ["example.com"]
    #   groups_claim: "groups"
  bootstrap_admins: ["admin@example.com"]
  access_token_ttl: "1h"
  refresh_token_ttl: "720h"
  session_max_age: "2160h"         # absolute duration of a login (90 days), even with continuous use; 0 = unlimited
  link_accounts_by_email: false    # true: login via a second provider takes over the account with the same e-mail (only with verified e-mails)
  allowed_redirect_uris:
    - "https://claude.ai/api/mcp/auth_callback"
    - "https://claude.com/api/mcp/auth_callback"        # Anthropic announces this change
    - "https://chatgpt.com/connector_platform_oauth_redirect"
    - "https://chatgpt.com/connector/oauth/*"           # '*' at the end = any remainder
    # check the providers' current callback URLs before going live
  allow_loopback_redirects: true   # local clients such as Claude Code (http://localhost:<port>/...)

database:
  url: "${DATABASE_URL}"

embedding:
  # Backends and their settings: docs/embedding.md
  backend: "tei"                 # tei | openai | bedrock
  url: "http://tei-embed:80"   # tei: Compose service name, locally e.g. http://localhost:8081; openai: base address of the API (empty = api.openai.com)
  model: "BAAI/bge-m3"
  dimensions: 1024             # fixed per database, at most 2000
  # api_key: "${EMBEDDING_API_KEY}"   # openai: key; tei: only if the TEI server runs with --api-key
  # query_prefix: "query: "           # only for models that require prefixes (E5)
  # document_prefix: "passage: "
  # timeout: 60s
  # options:                          # apply only to the chosen backend, typos are rejected
  #   batch_size: 16                  # tei 16, openai 32, bedrock (Cohere) 32
  #
  # Example OpenAI:
  #   backend: "openai", model: "text-embedding-3-small", dimensions: 1536,
  #   api_key: "${EMBEDDING_API_KEY}", options: { send_dimensions: true }
  # Example Amazon Bedrock (access via the IAM role, no key):
  #   backend: "bedrock", model: "amazon.titan-embed-text-v2:0", dimensions: 1024,
  #   options: { region: "eu-central-1" }

reranker:
  enabled: false
  backend: "tei"
  url: "http://tei-rerank:80"
  candidates: 30

search:
  fts_languages: ["german", "english", "simple"]   # always keep "simple"
  candidates_per_method: 50
  rrf_k: 60
  default_limit: 5
  max_limit: 20
  hnsw_ef_search: 100

chunking:
  target_tokens: 500
  max_tokens: 800

spaces:
  personal:
    enabled: true
    max_documents: 500
    max_bytes: 10485760          # 10 MB
    retention_days_after_offboarding: 30   # after this the personal space of blocked accounts is deleted; 0 = never (docs/offboarding.md)
  handoff_ttl_days: 14
  default_space_by_group: {}     # e.g. { "support": "support" }

policy:
  duplicate_threshold: 0.90
  max_document_bytes: 200000
  rate_limit_writes_per_minute: 20
  rate_limit_reads_per_minute: 120   # search, read, list per user; every search costs one embedding; 0 = unlimited

skills:
  # true: the author of a skill version may also approve it. Leave it off wherever a second
  # curator exists; it is meant for small installations with a single curator (docs/skills.md).
  allow_self_approval: false

tools:
  descriptions: {}
